name: Container Image Packages

on:
  push:
    paths:
      - dockerfiles/*
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  list-dockerfiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.dockerfiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: dockerfiles
        run: echo "matrix=$(ls dockerfiles/ | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  ghcr:
    runs-on: ubuntu-latest
    needs: list-dockerfiles
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(needs.list-dockerfiles.outputs.matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image-tag  # example output: "ghcr.io/kestra-io/aq:latest,ghcr.io/kestra-io/aq:38a8d1f"
        env:
          DOCKERFILE: ${{ matrix.image }}
        run: |
          IMAGE="ghcr.io/kestra-io/$(basename "$DOCKERFILE" .Dockerfile)"
          # the revision pinned by the Dockerfile, the tag used by default in the tasks
          REVISION=$(sed -n 's/^ARG [A-Z_]*REVISION=//p' "dockerfiles/$DOCKERFILE" | cut -c1-7)
          TAGS="$IMAGE:latest"
          if [ -n "$REVISION" ]; then
            TAGS="$TAGS,$IMAGE:$REVISION"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "file=dockerfiles/$DOCKERFILE" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image-tag.outputs.tags }}
          file: ${{ steps.image-tag.outputs.file }}
          platforms: linux/amd64,linux/arm64
